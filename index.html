<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriftForge Systems — Client Demo Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#08090d; --panel:#0f111a; --mid:#121424;
  --border:rgba(255,255,255,0.08); --accent:#6366f1; /* Curated Indigo */
  --peach:#ff9e7d; /* Curated Peach */
  --glow:0 0 20px rgba(99,102,241,0.5),0 0 40px rgba(99,102,241,0.15);
  --muted:#8a8eaf; --white:#f5f6fa; --green:#10b981;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;overflow:hidden;background:var(--black);}
body{color:var(--white);font-family:'DM Sans',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;}
.banner{flex-shrink:0;background:#08090d;border-bottom:2px solid rgba(99,102,241,0.25);position:relative;overflow:hidden;}
.banner::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 150% at 50% -30%,rgba(99,102,241,0.07) 0%,transparent 60%);}
.banner-row1{display:flex;align-items:center;padding:0 24px;height:68px;position:relative;z-index:1;gap:20px;}
.b-logo{display:flex;align-items:center;gap:11px;text-decoration:none;padding-right:20px;border-right:1px solid var(--border);flex-shrink:0;}
.b-logo-text{font-family:'Bebas Neue',sans-serif;line-height:.9;}
.b-logo-text .t{color:var(--white);font-size:21px;letter-spacing:3px;}
.b-logo-text .b{color:var(--accent);font-size:14px;letter-spacing:2px;text-shadow:var(--glow);}
.b-center{flex:1;text-align:center;}.b-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(16px,2.2vw,26px);letter-spacing:5px;}
.b-right{display:flex;align-items:center;gap:12px;padding-left:20px;border-left:1px solid var(--border);flex-shrink:0;}
.b-live{display:flex;align-items:center;gap:7px;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.5s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.b-badge{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:rgba(99,102,241,0.12);border:1px solid rgba(99,102,241,0.3);color:var(--accent);padding:4px 10px;border-radius:3px;}
.tabs-row{flex-shrink:0;display:flex;align-items:center;height:46px;background:#0b0c14;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.tab{display:flex;align-items:center;gap:9px;padding:0 20px;height:100%;border-bottom:2px solid transparent;border-right:1px solid var(--border);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all .2s;}
.tab.active{border-bottom-color:var(--accent);background:rgba(99,102,241,.05);}
.tab-name{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:2px;color:rgba(255,255,255,.4);}
.tab.active .tab-name{color:var(--white);}
.tab-sub{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1px;color:var(--muted);}
.content{flex:1;position:relative;overflow:hidden;background:var(--mid);}
.welcome{position:absolute;inset:0;z-index:10;background:var(--black);overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:44px 20px 40px;transition:opacity .3s;}
.welcome.hide{opacity:0;pointer-events:none;z-index:-1;}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;width:100%;max-width:880px;margin-top:40px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:3px;overflow:hidden;cursor:pointer;transition:transform .25s;}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 12px 30px rgba(0,0,0,0.5);}
.card-thumb{width:100%;height:180px;position:relative;background:#0a0a12;overflow:hidden;}
.card-thumb iframe{position:absolute;top:0;left:0;width:300%;height:300%;transform:scale(.3333);transform-origin:top left;pointer-events:none;border:none;}
.site-frame{position:absolute;inset:0;display:none;}
.site-frame.active{display:block;}
.site-frame iframe{width:100%;height:100%;border:none;}

/* COMPACT MODE FOR BANNER */
.banner { transition: all 0.3s ease; }
.banner.compact-mode {
  display: flex;
  flex-direction: row;
  height: 46px;
}
.banner.compact-mode .banner-row1 {
  height: 100%;
  padding: 0 16px;
  border-right: 1px solid var(--border);
}
.banner.compact-mode .b-center, 
.banner.compact-mode .b-right {
  display: none;
}
.banner.compact-mode .b-logo {
  border-right: none;
  padding-right: 0;
}
.banner.compact-mode .b-logo-text .t { font-size: 16px; }
.banner.compact-mode .b-logo-text .b { font-size: 10px; }
.banner.compact-mode .tabs-row {
  flex: 1;
  border-bottom: none;
}

@media (max-width: 768px) {
  .banner-row1 { padding: 0 16px; justify-content: space-between; }
  .b-center { display: none; }
  .b-logo { border-right: none; padding-right: 0; }
  .b-right { border-left: none; padding-left: 0; gap: 8px; }
  .b-live span { display: none; }
  .cards { grid-template-columns: 1fr; }
  .welcome h2 { font-size: 24px !important; text-align: center; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="banner">
    <div class="banner-row1">
      <a class="b-logo" href="#" onclick="showWelcome()">
        <div class="b-logo-text"><div class="t">DRIFTFORGE</div><div class="b">SYSTEMS</div></div>
      </a>
      <div class="b-center"><div class="b-title">Client Demo Portal</div></div>
      <div class="b-right">
        <div class="b-live"><div class="live-dot"></div><span>Live Preview</span></div>
        <div class="b-badge">4 Sites</div>
      </div>
    </div>
    <div class="tabs-row" id="tabsRow"></div>
  </div>

  <div class="content">
    <div class="welcome" id="welcome">
      <h2 style="font-family:'Bebas Neue'; font-size: 32px; letter-spacing: 4px; color: var(--accent);">CHOOSE A BUSINESS DEMO</h2>
      <div class="cards" id="cardsCont"></div>
    </div>
    <div id="framesCont"></div>
  </div>
</div>

<script>
// Directly linking to active live demos
const SITES = [
  { id:'voltstyle', name:'VOLT', sub:'Live Production', color:'#6366f1', type:'Events / Entertainment', file: 'voltstyle.html' },
  { id:'tarot', name:'Rainiie Tarot', sub:'Spirit Guide', color:'#d4a017', type:'Spiritual / Guide', file: 'tarot.html' },
  { id:'carlife', name:'Apex Detail', sub:'Auto Detailing', color:'#c9a84c', type:'Auto / Trades', file: 'carlife.html' },
  { id:'lumiere', name:'Lumière', sub:'Care & Wellness', color:'#ff9e7d', type:'Health / Wellness', file: 'lumiere.html' }
];

let currentId = null;

function init() {
    const tabsRow = document.getElementById('tabsRow');
    const cardsCont = document.getElementById('cardsCont');
    const framesCont = document.getElementById('framesCont');

    SITES.forEach((site) => {
        // Build Tabs
        const tab = document.createElement('div');
        tab.className = 'tab';
        tab.id = 'tab-' + site.id;
        tab.onclick = () => loadSite(site.id);
        tab.innerHTML = `<div style="background:${site.color}; width:8px; height:8px; border-radius:50%;"></div>
                         <div><div class="tab-name">${site.name}</div><div class="tab-sub" style="font-size:8px; color:var(--muted);">${site.sub}</div></div>`;
        tabsRow.appendChild(tab);

        // Build Cards
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => loadSite(site.id);
        card.innerHTML = `<div class="card-thumb"><iframe src="${site.file}"></iframe></div>
                          <div style="padding:15px;"><div style="color:${site.color}; font-size:9px; font-family:'JetBrains Mono'; text-transform:uppercase;">${site.type}</div>
                          <div style="font-family:'Bebas Neue'; font-size:22px; letter-spacing:1px;">${site.name}</div></div>`;
        cardsCont.appendChild(card);

        // Build Site Frame Containers
        const frameDiv = document.createElement('div');
        frameDiv.className = 'site-frame';
        frameDiv.id = 'frame-' + site.id;
        frameDiv.innerHTML = `<iframe id="ifr-${site.id}" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
        framesCont.appendChild(frameDiv);
    });
}

function loadSite(id) {
    currentId = id;
    const site = SITES.find(s => s.id === id);
    document.getElementById('welcome').classList.add('hide');
    document.querySelectorAll('.site-frame').forEach(f => f.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    
    document.getElementById('frame-' + id).classList.add('active');
    document.getElementById('tab-' + id).classList.add('active');
    
    document.querySelector('.banner').classList.add('compact-mode');
    
    const mainIframe = document.getElementById('ifr-' + id);
    if (!mainIframe.src || mainIframe.src === "") {
        mainIframe.src = site.file;
    }
}

function showWelcome() {
    currentId = null;
    document.getElementById('welcome').classList.remove('hide');
    document.querySelectorAll('.site-frame').forEach(f => f.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector('.banner').classList.remove('compact-mode');
}

init();
</script>
</body>
</html>
